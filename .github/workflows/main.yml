name: Cypress Tests

# cypress-io/github-action's `start` step exits here with
# "Socket closed before the connection was established" before Cypress launches,
# with or without a record key, so no spec runs. UI jobs start yarn start:ci and
# call yarn cypress:run in one shell instead. --record and --parallel are added
# only when CYPRESS_RECORD_KEY is set. Without it, each browser runs once.

on:
  push:
    branches-ignore:
      - "renovate/**"

jobs:
  install:
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.20.0
      options: --user 1001
    outputs:
      record: ${{ steps.cloud.outputs.record }}
      containers: ${{ steps.cloud.outputs.containers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress Cloud recording
        id: cloud
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: |
          if [ -n "$CYPRESS_RECORD_KEY" ]; then
            echo "record=true" >> "$GITHUB_OUTPUT"
            echo "containers=[1, 2, 3, 4, 5]" >> "$GITHUB_OUTPUT"
            echo "CYPRESS_RECORD_KEY is set. Recording to Cypress Cloud and splitting each browser across 5 machines."
          else
            echo "record=false" >> "$GITHUB_OUTPUT"
            echo "containers=[1]" >> "$GITHUB_OUTPUT"
            echo "CYPRESS_RECORD_KEY is not set. Each browser runs once, without --record or --parallel."
          fi

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          runTests: false
      # report machine parameters
      - run: yarn cypress info
      - run: node --version
      - run: node -p 'os.cpus()'
      - run: yarn types
      - run: yarn lint
      - run: yarn test:unit:ci
      - run: yarn build:ci

      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: build

  ui-chrome-tests:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.20.0
      options: --user 1001
    needs: install
    strategy:
      fail-fast: false
      matrix:
        containers: ${{ fromJSON(needs.install.outputs.containers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build folders
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Install
        run: yarn install --frozen-lockfile

      - name: UI Tests - Chrome
        shell: bash
        env:
          CYPRESS_BROWSER: chrome
          CYPRESS_GROUP: UI - Chrome
          CYPRESS_RECORD: ${{ needs.install.outputs.record }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: bash .github/workflows/run-ui.sh

      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-ui-chrome-${{ matrix.containers }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

  ui-chrome-mobile-tests:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.20.0
      options: --user 1001
    needs: install
    strategy:
      fail-fast: false
      matrix:
        containers: ${{ fromJSON(needs.install.outputs.containers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build folders
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Install
        run: yarn install --frozen-lockfile

      - name: UI Tests - Chrome - Mobile
        shell: bash
        env:
          CYPRESS_BROWSER: chrome
          CYPRESS_GROUP: UI - Chrome - Mobile
          CYPRESS_CONFIG: '{"e2e":{"viewportWidth":375,"viewportHeight":667}}'
          CYPRESS_RECORD: ${{ needs.install.outputs.record }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: bash .github/workflows/run-ui.sh

      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-ui-chrome-mobile-${{ matrix.containers }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

  ui-firefox-tests:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.20.0
      options: --user 1001
    needs: install
    strategy:
      fail-fast: false
      matrix:
        containers: ${{ fromJSON(needs.install.outputs.containers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build folders
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Install
        run: yarn install --frozen-lockfile

      - name: UI Tests - Firefox
        shell: bash
        env:
          CYPRESS_BROWSER: firefox
          CYPRESS_GROUP: UI - Firefox
          CYPRESS_RECORD: ${{ needs.install.outputs.record }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: bash .github/workflows/run-ui.sh

      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-ui-firefox-${{ matrix.containers }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

  ui-firefox-mobile-tests:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.20.0
      options: --user 1001
    needs: install
    strategy:
      fail-fast: false
      matrix:
        containers: ${{ fromJSON(needs.install.outputs.containers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build folders
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Install
        run: yarn install --frozen-lockfile

      - name: UI Tests - Firefox - Mobile
        shell: bash
        env:
          CYPRESS_BROWSER: firefox
          CYPRESS_GROUP: UI - Firefox - Mobile
          CYPRESS_CONFIG: '{"e2e":{"viewportWidth":375,"viewportHeight":667}}'
          CYPRESS_RECORD: ${{ needs.install.outputs.record }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: bash .github/workflows/run-ui.sh

      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-ui-firefox-mobile-${{ matrix.containers }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
